name: DSH pull request
on:
  push:
    branches: ['dsh/**']
permissions:
  contents: read
  pull-requests: write
jobs:
  create-pr:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - name: Open a pull request and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          existing_pr="$(gh pr list --state open --head "$HEAD_BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -z "$existing_pr" ]]; then
            topic="${HEAD_BRANCH#dsh/}"
            gh pr create \
              --base main \
              --head "$HEAD_BRANCH" \
              --title "DSH change: $topic" \
              --body "Automated pull request from the DSH KB workspace. CI must pass before GitHub auto-merges this change."
          fi
          gh pr merge "$HEAD_BRANCH" --auto --squash
