name: Frontend CI
on:
  pull_request:
  push:
    paths:
      - 'app/static/src/**'
      - 'app/static/index.html'
      - 'app/static/*.css'
      - 'tests/frontend/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.github/workflows/frontend-ci.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # app.ts is fully typed now; keep it that way instead of silently
      # disabling checking again.
      - name: Guard against TypeScript suppressions
        run: |
          if grep -rn "ts-nocheck\|ts-ignore\|ts-expect-error" app/static/src; then
            echo "::error::TypeScript error suppressions are not allowed in app/static/src"
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Build bundle
        run: npm run build
      - name: Verify served entry bundle exists
        run: test -f app/static/dist/app.js
      # Production updates automatically from a release image, so boot the built
      # bundle here rather than letting a broken UI reach kb.konverta.eu.
      - name: Smoke test the built bundle
        run: npm run test:frontend
