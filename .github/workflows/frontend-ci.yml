name: Frontend CI
on:
  pull_request:
  push:
    paths:
      - 'app/static/src/**'
      - 'app/static/style*.css'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-ci.yml'
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build bundle
        run: npm run build
      - name: Verify served entry bundle exists
        run: test -f app/static/dist/app.js
