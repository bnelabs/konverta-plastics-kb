name: SemVer release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest
      # The host deploys this image automatically, so the frontend bundle is
      # built and booted before a release can be published.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build frontend bundle
        run: npm run build
      - name: Smoke test frontend bundle
        run: npm run test:frontend
      - name: Validate SemVer tag and image build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          VERSION="${RELEASE_TAG#v}"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          docker build --pull --platform linux/amd64 --build-arg APP_VERSION="$VERSION" --tag "plastics-kb:$VERSION" .
          docker save "plastics-kb:$VERSION" | gzip -1 > "/tmp/plastics-kb-$VERSION.tar.gz"
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --generate-notes
      - name: Attach versioned deployment image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" "/tmp/plastics-kb-${RELEASE_TAG#v}.tar.gz"
