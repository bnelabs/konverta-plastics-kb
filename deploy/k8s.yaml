apiVersion: v1
kind: Namespace
metadata:
  name: plastics-kb
  labels:
    app.kubernetes.io/part-of: konverta-plastics-kb
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plastics-kb-data
  namespace: plastics-kb
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plastics-kb
  namespace: plastics-kb
  labels:
    app.kubernetes.io/name: plastics-kb
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: plastics-kb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plastics-kb
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plastics-kb
          image: localhost:32000/plastics-kb:0.1.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
            - name: mcp
              containerPort: 8001
          env:
            - name: KB_DB_PATH
              value: /data/plastics-kb.sqlite3
            - name: APP_VERSION
              value: 0.1.2
            - name: CF_ACCESS_TEAM_DOMAIN
              value: https://withered-mode-61c7.cloudflareaccess.com
            - name: CF_ACCESS_AUD
              value: c1ccae79ecdc57c87c12673de22b2d3faedd27d2dbb128bce18c57ad0fbdc576
            - name: CF_ACCESS_EMAIL
              value: baris@konverta.eu
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: plastics-kb-data
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: plastics-kb
  namespace: plastics-kb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: plastics-kb
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: plastics-kb-mcp
  namespace: plastics-kb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: plastics-kb
  ports:
    - name: mcp
      port: 8001
      targetPort: mcp
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: plastics-kb-ingress
  namespace: plastics-kb
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: plastics-kb
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: deepseek-harness
      ports:
        - protocol: TCP
          port: 8001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plastics-kb
  namespace: plastics-kb
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: kb.konverta.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plastics-kb
                port:
                  name: http
  tls:
    - hosts: [kb.konverta.eu]
      secretName: kb-konverta-eu-tls
